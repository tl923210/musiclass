  </div>`;
}
document.addEventListener('click', async e => {
  if (e.target.id === 'pin-copy' && T.pins) {
    const ok = await copyText(['반\t번호\t학번\t이름\tPIN'].concat(T.pins.map(p => [p.classNo, p.seatNo, p.studentNo, p.name, p.pin].join('\t'))).join('\n'));
    toast(ok ? '배부표를 복사했어요. 엑셀이나 한글 표에 붙여 넣으세요.' : '복사하지 못했어요.', ok ? '' : 'bad');
  }
  if (e.target.id === 'pin-hide') { T.pins = null; const el = $('#r-pins'); if (el) el.innerHTML = ''; }
});

/* ---- 세특 ---- */
async function tSetech(v) {
  v.innerHTML = `<div class="stack">
    <div class="toolbar">${classSelect('x-class')}
      <label class="row small" style="min-height:44px"><input type="checkbox" id="x-head" style="width:18px;height:18px" ${store.get('x-head') ? 'checked' : ''}>일괄 복사에 '학번 이름' 머리줄 넣기</label>
      <button class="btn primary" id="x-copyall">확정본 일괄 복사</button>
    </div>
    ${!aiMode() ? `<div class="warnbox stack-s" id="x-choose"><span>AI 초안을 어떻게 만들지 골라 주세요.</span>
      <span class="row"><button class="btn sm primary" id="x-go-key">API 키 등록하기</button><button class="btn sm" id="x-no-key">등록할 키 없음</button></span>
      <span class="small" style="font-weight:400">키가 없으면 익명 프롬프트를 복사해 ChatGPT·Gemini·Claude 웹 채팅에 붙여 넣는 방식으로 써요.</span></div>`
      : `<p class="small muted">AI 방식: <b>${aiMode() === 'none' ? '키 없음 (프롬프트 복사)' : esc(AI_PROVIDERS[aiMode()].label + ' · ' + ((aiSettings() || {}).model || ''))}</b> · <button class="linkbtn" id="x-go-key">바꾸기</button></p>`}
    <div class="batch-bar"${aiMode() === 'none' ? ' hidden' : ''}>
      <button class="btn sm" id="x-batch">초안 없는 학생 AI 일괄 생성</button>
      <label class="row small">요청 간격 <input type="number" id="x-gap" min="2" max="60" value="${esc(store.get('x-gap') || 6)}" aria-label="요청 간격(초)">초</label>
      <button class="btn sm danger" id="x-stop" hidden>중지</button>
      <div class="progress" id="x-prog-bar" hidden><div></div></div>
      <span class="small muted num" id="x-prog"></span>
    </div>
    <p class="hint">AI에는 학생 이름을 '학생 A'로 바꾼 자료만 들어가요. 초안은 반드시 직접 읽고 고친 뒤 확정하세요. 확정한 문장만 복사할 수 있어요.</p>
    <div id="x-body"></div></div>`;
  bindClass('x-class', () => tSetech(v));
  const goKey = $('#x-go-key');
  if (goKey) goKey.onclick = () => { T.tab = 'tools'; store.set('t-tab', 'tools'); teaRender(); setTimeout(() => { const k = $('#k-ai'); if (k) k.scrollIntoView({ block: 'start' }); }, 400); };
  const noKey = $('#x-no-key');
  if (noKey) noKey.onclick = () => { store.set(AI_SET, { provider: 'none' }); toast('키 없이 쓰는 방식으로 정했어요. 학생마다 [프롬프트 복사]를 누르세요.'); tSetech(v); };
  $('#x-head').onchange = e => store.set('x-head', e.target.checked);
  const body = $('#x-body');
  loading(body);
  const list = T.students.filter(s => s.classNo === T.classNo);
  const [matrix, drafts, details] = await Promise.all([
    api.submissionMatrix(T.classNo),
    Promise.all(list.map(s => api.getDraft(s.id, api.TERM))),
    Promise.all(list.map(s => api.studentDetail(s.id)))
  ]);
  const rows = list.map((s, i) => {
    const r = matrix.rows.find(x => x.student.id === s.id);
    const subCount = r ? Object.values(r.cells).filter(Boolean).length : 0;
    return { s, draft: drafts[i], subCount, obsCount: details[i].observations.length };
  });
  body.innerHTML = `<div class="stack">${rows.map(({ s, draft, subCount, obsCount }) => {
    const text = draft ? (draft.finalText || draft.aiDraft || '') : '';
    const st = draft ? draft.status : null;
    const thin = obsCount === 0 || subCount <= 1;
    return `<section class="card setech-card" data-sid="${esc(s.id)}" data-status="${esc(st || '')}">
      <div class="spread">
        <h3><span class="num">${esc(s.studentNo)}</span> ${esc(s.name)}</h3>
        <span class="row"><span class="evid"><span class="chip num">제출 ${subCount}</span><span class="chip num">메모 ${obsCount}</span>${thin ? '<span class="pill warn">근거 부족</span>' : ''}</span>
          <span class="x-status">${st === 'confirmed' ? '<span class="pill solid">확정</span>' : st === 'draft' ? '<span class="pill">초안</span>' : '<span class="pill">미작성</span>'}</span></span>
      </div>
      <textarea aria-label="${esc(s.name)} 세특" placeholder="세특 문장을 쓰거나 AI 초안을 생성하세요.">${esc(text)}</textarea>
      <div class="x-extra-row"><input type="text" class="x-extra" maxlength="200" placeholder="추가 지시 (선택) 예: 모둠 협업 장면을 강조해 줘" aria-label="${esc(s.name)} 추가 지시"><span></span></div>
      <ul class="x-evid" aria-label="AI가 근거로 쓴 기록"></ul>
      <div class="spread">
        <span class="bytes"></span>
        <span class="row">
          <button class="btn sm" data-act="ai">${aiMode() === 'none' ? '프롬프트 복사' : 'AI 초안 생성'}</button>
          <button class="btn sm" data-act="save">저장</button>
          <button class="btn sm" data-act="confirm"></button>
          <button class="btn sm primary" data-act="copy">복사</button>
        </span>
      </div>
    </section>`;
  }).join('')}</div>`;

  const sync = card => {
    const ta = $('textarea', card), b = neisBytes(ta.value), st = card.dataset.status, dirty = card.dataset.dirty === '1';
    const bytes = $('.bytes', card);
    bytes.textContent = `${b.toLocaleString()} / ${NEIS_LIMIT.toLocaleString()} 바이트 (한글 약 ${Math.floor(NEIS_LIMIT / 3)}자)`;
    bytes.classList.toggle('over', b > NEIS_LIMIT);
    const cb = $('[data-act="confirm"]', card);
    cb.textContent = st === 'confirmed' && !dirty ? '확정 해제' : '확정';
    cb.disabled = !ta.value.trim() || b > NEIS_LIMIT;
    $('[data-act="copy"]', card).disabled = !(st === 'confirmed' && !dirty);
    $('.x-status', card).innerHTML = st === 'confirmed' && !dirty ? '<span class="pill solid">확정</span>'
      : dirty ? '<span class="pill warn">수정됨 · 저장 전</span>' : st === 'draft' ? '<span class="pill">초안</span>' : '<span class="pill">미작성</span>';
  };
  $$('.setech-card', body).forEach(card => {
    sync(card);
    $('textarea', card).oninput = () => { card.dataset.dirty = '1'; sync(card); };
    card.onclick = async e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const sid = card.dataset.sid, ta = $('textarea', card);
      const act = btn.dataset.act;
      if (act === 'ai') {
        if (ta.value.trim() && !(await confirmBox('지금 적힌 문장을 AI 초안으로 바꿀까요?', '새로 생성'))) return;
        await aiGenerateCard(card, btn);
        return;
      }
      if (act === 'copy') {
        const ok = await copyText(ta.value.trim());
        toast(ok ? '복사했어요. NEIS에 붙여 넣으세요.' : '복사하지 못했어요. 글을 직접 선택해 복사해 주세요.', ok ? '' : 'bad');
        if (!ok) ta.select();
        return;
      }
      const status = act === 'confirm' ? (card.dataset.status === 'confirmed' && card.dataset.dirty !== '1' ? 'draft' : 'confirmed') : 'draft';
      await withBusy(btn, '…', async () => {
        try {
          await api.saveDraft(sid, api.TERM, { finalText: ta.value, status });
          card.dataset.status = status; card.dataset.dirty = '';
          toast(status === 'confirmed' ? '확정했어요. 이제 복사할 수 있어요.' : '초안으로 저장했어요.');
        } catch (err) { report(err); }
      });
      sync(card);
    };
  });
  /* AI 초안 생성: 카드 하나 */
  async function aiGenerateCard(card, btn) {
    const mode = aiMode();
    const sid = card.dataset.sid, ta = $('textarea', card), evid = $('.x-evid', card);
    if (!mode) { toast('먼저 AI 방식을 골라 주세요: 위의 [API 키 등록하기] 또는 [등록할 키 없음]', 'bad'); return { ok: false, stop: true }; }
    if (mode === 'none') {
      try {
        const { prompt, target } = await buildAiPrompt(sid, $('.x-extra', card).value, true);
        showPromptModal(target.name, prompt);
      } catch (e) { report(e); }
      return { ok: true };
    }
    if (!aiKey()) { toast('이 기기에 저장된 API 키가 없어요. 설정·점검 탭에서 키를 다시 넣어 주세요.', 'bad'); return { ok: false, stop: true }; }
    card.classList.add('busy'); card.classList.remove('failed');
    const old = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '생성하는 중…'; }
    try {
      const r = await aiGenerate(sid, $('.x-extra', card).value);
      ta.value = r.draft;
      card.dataset.status = 'draft'; card.dataset.dirty = '';
      evid.innerHTML = r.evidence.map(x => `<li>${esc(x)}</li>`).join('');
      sync(card);
      if (/학생\s*A/.test(r.draft)) toast('초안에 \'학생 A\'가 들어 있어요. 세특에는 학생을 가리키는 말을 쓰지 않으니 고쳐 주세요.', 'bad');
      return { ok: true };
    } catch (e) {
      card.classList.add('failed');
      report(e);
      return { ok: false, stop: ['QUOTA', 'KEY', 'MODEL', 'NOKEY', 'NET'].includes(e.code) };
    } finally {
      card.classList.remove('busy');
      if (btn) { btn.disabled = false; btn.textContent = old; }
    }
  }
  /* 일괄 생성: 초안 없는 학생만, 한 명씩, 간격을 두고 */
  let stopFlag = false;
  $('#x-gap').onchange = e => store.set('x-gap', Math.max(2, Math.min(60, Number(e.target.value) || 6)));
  $('#x-stop').onclick = () => { stopFlag = true; $('#x-prog').textContent += ' · 중지하는 중…'; };
  $('#x-batch').onclick = async () => {
    const targets = $$('.setech-card', body).filter(c => !$('textarea', c).value.trim() && c.dataset.status !== 'confirmed');
    if (!targets.length) { toast('이 반에는 초안이 비어 있는 학생이 없어요.'); return; }
    if (aiMode() === 'none') { toast('일괄 생성은 API 키를 등록했을 때만 쓸 수 있어요. 키 없이 쓸 때는 학생마다 [프롬프트 복사]를 눌러 주세요.', 'bad'); return; }
    if (!aiMode() || !aiKey()) { toast('설정·점검 탭의 \'AI 세특 연결\'에서 API 키를 먼저 등록해 주세요.', 'bad'); return; }
    const gap = Math.max(2, Math.min(60, Number($('#x-gap').value) || 6));
    if (!(await confirmBox(`초안이 비어 있는 ${targets.length}명의 AI 초안을 한 명씩 만들까요? 약 ${Math.ceil(targets.length * (gap + 8) / 60)}분 걸려요. 화면을 닫지 마세요.`, '시작'))) return;
    stopFlag = false;
    const bar = $('#x-prog-bar'), fill = $('div', bar), label = $('#x-prog');
    $('#x-batch').disabled = true; $('#x-stop').hidden = false; bar.hidden = false;
    let ok = 0, bad = 0;
    for (let i = 0; i < targets.length; i++) {
      if (stopFlag) break;
      const name = (T.students.find(x => x.id === targets[i].dataset.sid) || {}).name || '';
      label.textContent = `${i + 1}/${targets.length} ${name} 생성 중 · 성공 ${ok} · 실패 ${bad}`;
      targets[i].scrollIntoView({ block: 'center', behavior: 'smooth' });
      const r = await aiGenerateCard(targets[i], $('[data-act="ai"]', targets[i]));
      r.ok ? ok++ : bad++;
      fill.style.width = `${Math.round((i + 1) / targets.length * 100)}%`;
      if (r.stop) { stopFlag = true; break; }
      if (i < targets.length - 1 && !stopFlag) await new Promise(res => setTimeout(res, gap * 1000));
    }
    label.textContent = `${stopFlag ? '중지됨' : '끝'} · 성공 ${ok} · 실패 ${bad}${bad ? ' (빨간 테두리 학생은 [AI 초안 생성]으로 다시 시도)' : ''}`;
    $('#x-batch').disabled = false; $('#x-stop').hidden = true;
    toast(`일괄 생성 ${stopFlag ? '중지' : '완료'}: 성공 ${ok}명, 실패 ${bad}명`);
  };

  $('#x-copyall').onclick = async () => {
    const cards = $$('.setech-card', body).filter(c => c.dataset.status === 'confirmed' && c.dataset.dirty !== '1');
    if (!cards.length) { toast('이 반에 확정한 세특이 아직 없어요.', 'bad'); return; }
    const head = $('#x-head').checked;
    const text = cards.map(c => {
      const s = T.students.find(x => x.id === c.dataset.sid);
      return (head ? `${s.studentNo} ${s.name}\n` : '') + $('textarea', c).value.trim();
    }).join('\n\n');
    const ok = await copyText(text);
    toast(ok ? `확정본 ${cards.length}명을 학번순으로 복사했어요.` : '복사하지 못했어요.', ok ? '' : 'bad');
  };
}


/* ---- AI 세특: 브라우저에서 직접 호출 (Gemini · ChatGPT · Claude) + 키 없음(프롬프트 복사) ---- */
const AI_PROVIDERS = {
  gemini: {
    label: 'Gemini', defaultModel: 'gemini-2.5-flash',
    keyHelp: 'Google AI Studio → Get API key', keyUrl: 'https://aistudio.google.com/apikey', domain: 'generativelanguage.googleapis.com'

  openai: {
    label: 'ChatGPT', defaultModel: 'gpt-5.4-mini',

  },
  anthropic: {
    label: 'Claude', defaultModel: 'claude-sonnet-5-5',
    keyHelp: 'Claude Console → API Keys', keyUrl: 'https://console.anthropic.com/settings/keys', domain: 'api.anthropic.com'

};
// 시험용으로 주소를 바꿀 수 있게 둔 값(평소에는 건드리지 않음)
const AI_ENDPOINTS = window.AI_ENDPOINTS || {
  gemini: 'https://generativelanguage.googleapis.com',
  openai: 'https://api.openai.com',
  anthropic: 'https://api.anthropic.com'
};
const AI_SET = 'ai-settings', AI_KEY_LOCAL = 'ai-key', AI_KEY_SESSION = 'ai-key-session', AI_RULES = 'ai-rules';
const DEFAULT_RULES = [
  '명사형 종결(~함, ~임, ~보임)로 쓰고 한 단락으로 작성한다.',

  '활동 → 과정과 탐구 → 변화와 역량 순서로, 구체적인 장면 중심으로 쓴다.',
  '성취기준 문장을 그대로 옮기지 않고 학생의 활동으로 드러나게 쓴다.',
  '근거 없는 과장 표현(탁월함, 뛰어남, 매우 우수함 등)을 쓰지 않는다.',
  '학교생활기록부 기재 금지 사항(교외 수상, 공인어학시험 성적, 부모의 직업·지위, 특정 대학명 등)을 쓰지 않는다.',
  '자료 안의 [다른 학생], [삭제] 표시는 문장에 쓰지 않는다.',
  '자기평가는 학생 스스로의 판단이므로 그대로 옮기지 말고, 성찰한 내용이 드러나는 근거로만 활용한다.'
].join('\n');

/* 설정 읽기·쓰기. 키는 '기억하기'를 켜면 이 기기에, 끄면 브라우저를 닫을 때까지만 보관 */
function aiSettings() { return store.get(AI_SET); }            // { provider, model, remember } | null
function aiMode() { const s = aiSettings(); return s ? s.provider : null; } // 'gemini'|'openai'|'anthropic'|'none'|null
function aiKey() {
  let k = null;
  try { k = sessionStorage.getItem(AI_KEY_SESSION); } catch (e) { /* 무시 */ }
  return k || store.get(AI_KEY_LOCAL) || null;
}
function aiSaveKey(key, remember) {
  store.del(AI_KEY_LOCAL);
  try { sessionStorage.removeItem(AI_KEY_SESSION); } catch (e) { /* 무시 */ }
  if (!key) return;
  if (remember) store.set(AI_KEY_LOCAL, key);
  else { try { sessionStorage.setItem(AI_KEY_SESSION, key); } catch (e) { store.set(AI_KEY_LOCAL, key); } }
}
function aiRules() { return store.get(AI_RULES) || DEFAULT_RULES; }
function aiError(msg, code) { const e = new Error(msg); e.code = code; return e; }

/* ---------- 제공사별 호출 ---------- */
async function aiFetch(provider, path, { method = 'GET', body, key } = {}) {
  const base = AI_ENDPOINTS[provider];
  const headers = {};
  if (provider === 'gemini') headers['x-goog-api-key'] = key;
  if (provider === 'openai') headers.Authorization = 'Bearer ' + key;
  if (provider === 'anthropic') {
    headers['x-api-key'] = key;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true'; // 브라우저에서 직접 호출 허용
  }
  if (body) headers['Content-Type'] = 'application/json';
  const waits = [2000, 5000];
  for (let i = 0; ; i++) {
    let res;
    try { res = await fetch(base + path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
    catch (e) {
      console.error(LOG, e);
      throw aiError(`${AI_PROVIDERS[provider].label} 서버에 연결하지 못했어요. 인터넷 연결이나 학교 방화벽(${AI_PROVIDERS[provider].domain})을 확인해 주세요.`, 'NET');
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (res.ok) return data;
    if ([429, 500, 503, 529].includes(res.status) && i < waits.length) { await new Promise(r => setTimeout(r, waits[i])); continue; }
    const msg = String((data && data.error && (data.error.message || data.error)) || text || '').slice(0, 200);
    console.warn(LOG, provider, res.status, msg);
    if (res.status === 401 || res.status === 403 || /api[ _-]?key/i.test(msg) && res.status === 400) throw aiError(`${AI_PROVIDERS[provider].label} API 키가 올바르지 않거나 권한이 없어요. 설정·점검 탭에서 키를 다시 확인해 주세요.`, 'KEY');
    if (res.status === 404 || /model/i.test(msg) && res.status === 400) throw aiError(`모델 이름을 찾을 수 없어요. 설정·점검 탭의 [모델 목록 불러오기]로 확인해 주세요. (${msg})`, 'MODEL');
    if (res.status === 429) throw aiError(`${AI_PROVIDERS[provider].label} 사용 한도를 넘었어요. 잠시 뒤 다시 시도하거나 요금·한도 설정을 확인해 주세요. (${msg})`, 'QUOTA');
    if (res.status === 402 || /credit|billing|balance/i.test(msg)) throw aiError(`${AI_PROVIDERS[provider].label} 계정의 크레딧이나 결제 설정을 확인해 주세요. (${msg})`, 'QUOTA');
    throw aiError(`${AI_PROVIDERS[provider].label} 오류 ${res.status}: ${msg}`, 'AI');
  }
}
async function aiComplete(prompt, { json = true, temperature = 0.4 } = {}) {
  const s = aiSettings(), key = aiKey();
  if (!s || s.provider === 'none' || !key) throw aiError('설정·점검 탭의 \'AI 세특 연결\'에서 API 키를 먼저 등록해 주세요.', 'NOKEY');
  const model = s.model || AI_PROVIDERS[s.provider].defaultModel;
  let text = '';
  if (s.provider === 'gemini') {
    const d = await aiFetch('gemini', `/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST', key,
      body: { contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { temperature, ...(json ? { responseMimeType: 'application/json' } : {}) } }
    });
    const c = (d.candidates || [])[0];
    text = c && c.content && c.content.parts ? c.content.parts.map(p => p.text || '').join('') : '';
  } else if (s.provider === 'openai') {
    const d = await aiFetch('openai', '/v1/chat/completions', { method: 'POST', key, body: { model, messages: [{ role: 'user', content: prompt }] } });
    text = (((d.choices || [])[0] || {}).message || {}).content || '';
  } else {
    const d = await aiFetch('anthropic', '/v1/messages', { method: 'POST', key, body: { model, max_tokens: 2048, temperature, messages: [{ role: 'user', content: prompt }] } });
    text = (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  }
  if (!text.trim()) throw aiError('AI가 빈 답을 보냈어요. 다시 시도해 주세요.', 'AI');
  return { text, model: `${s.provider}:${model}` };
}
async function aiListModels(provider, key) {
  if (provider === 'gemini') {
    const d = await aiFetch('gemini', '/v1beta/models?pageSize=200', { key });
    return (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace(/^models\//, ''));
  }
  if (provider === 'openai') {
    const d = await aiFetch('openai', '/v1/models', { key });
    return (d.data || []).map(m => m.id).filter(id => /^(gpt|o\d|chat)/.test(id) && !/audio|realtime|transcribe|tts|image|search/.test(id)).sort().reverse();
  }
  const d = await aiFetch('anthropic', '/v1/models?limit=100', { key });
  return (d.data || []).map(m => m.id);
}
function parseDraft(raw) {
  const cleaned = String(raw).replace(/^\s*```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  const pick = o => ({ draft: String(o.draft || '').trim(), evidence: Array.isArray(o.evidence) ? o.evidence.map(String) : [] });
  try { return pick(JSON.parse(cleaned)); }
  catch (e) {
    const m = cleaned.match(/\{[\s\S]*\}/);
    if (m) { try { return pick(JSON.parse(m[0])); } catch (e2) { /* 아래로 */ } }
    return { draft: cleaned, evidence: [] };
  }
}

/* ---------- 익명화 ----------
   학생 이름 → '학생 A', 다른 학생 이름 → '[다른 학생]', 학번·전화·이메일 → '[삭제]'
   누가 '학생 A'인지는 이 화면에서만 알고, 어디에도 보내거나 저장하지 않는다 */
function anonymizer(target, roster) {
  const all = Array.from(new Set(roster.map(s => String(s.name || '').trim()).filter(Boolean)));
  const full = all.slice().sort((a, b) => b.length - a.length);
  const given = all.filter(n => n.length >= 3).map(n => [n.slice(1), n]).sort((a, b) => b[0].length - a[0].length);
  const mask = text => {
    let t = String(text == null ? '' : text);
    full.forEach(n => { t = t.split(n).join(n === target.name ? '학생 A' : '[다른 학생]'); });
    given.forEach(([g, n]) => { t = t.split(g).join(n === target.name ? '학생 A' : '[다른 학생]'); });
    return t
      .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, '[삭제]')
      .replace(/01[016789][-\s]?\d{3,4}[-\s]?\d{4}/g, '[삭제]')
      .replace(/\d{5,}/g, '[삭제]');
  };
  const leftover = text => full.find(n => String(text).includes(n)) || null;
  return { mask, leftover };
}

/* ---------- 프롬프트 만들기 (브라우저 안에서) ---------- */
const LV_TEXT = { good: '잘함', ok: '보통', try: '노력 필요' };
const SETECH_MIN_BYTES = 1050; // 상한은 NEIS_LIMIT(1500)
async function buildAiPrompt(studentId, extra, manual) {
  const d = await api.studentDetail(studentId);
  const target = d.student;
  const A = anonymizer(target, T.students);
  const subs = d.submissions.filter(x => x.submission);
  const obs = d.observations.slice().sort((a, b) => String(a.observedOn).localeCompare(String(b.observedOn)));
  if (!subs.length && !obs.length) throw aiError(`${target.name} 학생은 제출물과 관찰 메모가 없어 초안을 만들 근거가 없어요.`, 'EMPTY');
  const std = new Map();
  subs.forEach(x => (x.assignment.standards || []).forEach(st => std.set(st.code, st.statement)));
  const records = subs.map(x => {
    const a = x.assignment, s = x.submission;
    const qa = a.guideQuestions.map(q => `  Q. ${q.text}\n  A. ${(s.reflection || {})[q.id] || '(답변 없음)'}`).join('\n');
    const se = a.standards.map(st => { const e = (s.selfEval || {})[st.code] || {}; return `${st.code} ${LV_TEXT[e.level] || '-'}${e.reason ? `(${e.reason})` : ''}`; }).join(' / ');
    return `■ 단원: ${a.title}\n${qa}${se ? `\n  자기평가: ${se}` : ''}`;
  });
  const prompt = [
    `너는 고등학교 인공지능 기초 담당 교사다. 아래에 주어진 자료만 근거로 학교생활기록부 「세부능력 및 특기사항」 초안을 작성한다.`,
    '', '[기재 규칙]', aiRules().split('\n').map(r => r.trim()).filter(Boolean).map(r => '- ' + r).join('\n'),
    '', '[분량]', `${SETECH_MIN_BYTES}~${NEIS_LIMIT} 바이트 사이의 한 단락 (한글 1자 = 3바이트, 영문·숫자·공백 1바이트). 근거가 적으면 더 짧아도 된다.`,
    '', '[관련 성취기준]', Array.from(std, ([c, s]) => `- ${c} ${s}`).join('\n') || '- (연결된 성취기준 없음)',
    '', '[학생 활동 기록: 학생 A의 단원별 성찰 노트와 자기평가]', records.join('\n\n') || '(제출한 기록 없음)',
    '', '[교사 관찰 기록]', obs.map(o => `- ${o.observedOn}${o.assignmentTitle ? ` [${o.assignmentTitle}]` : ''} ${o.note}`).join('\n') || '(관찰 기록 없음)',
    '', '[교사 추가 지시]', String(extra || '').trim() || '(없음)',
    '', '[출력 형식]',
    manual
      ? '세특 본문 한 단락만 출력한다. 제목, 설명, 따옴표, 글자 수 표시 없이 문장만 쓴다.'
      : '다른 말 없이 JSON 하나만 출력한다: {"draft": "세특 본문 한 단락", "evidence": ["근거로 쓴 기록을 한 줄씩 요약", "..."]}'
  ].join('\n');
  const safe = A.mask(prompt);
  const left = A.leftover(safe);
  if (left) throw aiError(`익명화 후에도 이름(${left})이 남아 있어 진행하지 않았어요. 해당 학생의 기록을 확인해 주세요.`, 'PII');
  return { prompt: safe, target };
}

/* API 키로 초안 만들기 → 저장 */
async function aiGenerate(studentId, extra) {
  const { prompt, target } = await buildAiPrompt(studentId, extra, false);
  const first = await aiComplete(prompt, { json: true });
  let out = parseDraft(first.text);
  if (neisBytes(out.draft) > NEIS_LIMIT) {
    const again = await aiComplete(
      `다음 학교생활기록부 세특 문장을 의미와 근거는 유지하고 문체(명사형 종결)를 지키면서 ${NEIS_LIMIT}바이트(한글 1자 = 3바이트) 이하의 한 단락으로 줄여라. 새로운 내용을 더하지 마라.\n` +
      `다른 말 없이 JSON 하나만 출력: {"draft": "줄인 문장"}\n\n${out.draft}`, { json: true, temperature: 0.2 });
    const shorter = parseDraft(again.text).draft;
    if (shorter) out.draft = shorter;
  }
  await api.saveDraft(studentId, api.TERM, { aiDraft: out.draft, finalText: out.draft, status: 'draft', model: first.model });
  // 화면에 보여 줄 때만 '학생 A'를 실제 이름으로 되돌림(근거 목록). 초안 본문은 그대로 둔다
  const evidence = out.evidence.map(x => String(x).split('학생 A').join(target.name));
  return { draft: out.draft, evidence, model: first.model };
}

function bindAiSettings(v) {

    const mode = current();
    const save = $('#k-ai-save', v);
    if (save) save.onclick = () => {
      if (mode === 'none') { store.set(AI_SET, { provider: 'none' }); aiSaveKey(null); toast('키 없이 쓰는 방식으로 정했어요. 세특 탭에서 [프롬프트 복사]를 누르세요.'); return; }

      toast(`${AI_PROVIDERS[mode].label} 키를 저장했어요.${remember ? '' : ' 브라우저를 닫으면 지워져요.'}`);

    });
  };
  $$('input[name="k-ai-p"]', v).forEach(r => r.onchange = () => { body.innerHTML = aiSettingsBody(current(), aiSettings() || {}); out.innerHTML = ''; bindBody(); });
  bindBody();
  $('#k-ai-rules-save', v).onclick = () => { store.set(AI_RULES, $('#k-ai-rules', v).value.trim() || DEFAULT_RULES); toast('기재 규칙을 저장했어요.'); };
  $('#k-ai-rules-reset', v).onclick = () => { store.del(AI_RULES); $('#k-ai-rules', v).value = DEFAULT_RULES; toast('기본 규칙으로 되돌렸어요.'); };
}

/* ---- 설정·점검 ---- */
function csvText(rows) {
  return '﻿' + rows.map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
}
function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const fmtISO = ms => { if (!ms) return ''; const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${fmtTime(ms)}`; };
const LEVEL_TEXT = { good: '잘함', ok: '보통', try: '노력 필요' };
async function tTools(v) {
  const host = (window.APP_CONFIG && window.APP_CONFIG.SUPABASE_URL || '').replace(/^https?:\/\//, '');
  v.innerHTML = `<div class="units-layout">
    <div class="stack">
      <section class="card stack">
        <h2>연결 상태</h2>
        <p>${api.MOCK ? '<span class="pill mock-pill">가짜 데이터 모드</span> 이 브라우저에만 저장돼요. 운영하려면 index.html 맨 위 APP_CONFIG에 Supabase 주소와 키를 넣어 주세요.' : `<span class="pill ok">Supabase 모드</span> <span class="num">${esc(host)}</span>`}</p>
        <div><button class="btn" id="k-check">접속 점검</button></div>
        <div id="k-check-out"></div>
        <p class="hint">학교 크롬북과 교사 PC에서 한 번씩 눌러 보세요. '접속 차단'이 나오면 정보부에 supabase.co 도메인 허용을 요청해 주세요.</p>
      </section>
      <section class="card stack">
        <h2>학기</h2>
        <div class="row" style="align-items:end">
          <label class="field" style="flex:1 1 160px"><span>현재 학기</span><input id="k-term" type="text" value="${esc(api.TERM)}" placeholder="예: 2026-2"></label>
          <button class="btn" id="k-term-save">학기 바꾸기</button>
        </div>
        <p class="hint">학기를 바꾸면 학생 화면과 단원 목록이 새 학기 기준으로 바뀌어요. 지난 학기 자료는 지워지지 않아요.</p>
      </section>
      <section class="card stack">
        <h2>교사 비밀번호 바꾸기</h2>
        <form id="k-pw-form" class="stack" novalidate>
          <input type="text" name="username" value="teacher" autocomplete="username" hidden>
          <label class="field"><span>지금 비밀번호</span><input id="k-pw-old" type="password" autocomplete="current-password"></label>
          <label class="field"><span>새 비밀번호 (8자 이상)</span><input id="k-pw-new" type="password" autocomplete="new-password"></label>
          <label class="field"><span>새 비밀번호 확인</span><input id="k-pw-new2" type="password" autocomplete="new-password"></label>
          <div><button class="btn" id="k-pw-save" type="submit">비밀번호 바꾸기</button></div>
        </form>
        <p class="hint">바꾸면 다른 기기에 로그인되어 있던 교사 화면은 모두 로그아웃돼요.</p>
      </section>
    </div>
    <div class="stack">
      <section class="card stack">
        <h2>사진 저장 용량</h2>
        <div id="k-usage"><div class="loading">불러오는 중…</div></div>
      </section>
      <section class="card stack">
        <h2>백업 (CSV)</h2>
        <p class="hint">현재 학기 자료를 엑셀에서 열 수 있는 CSV로 내려받아요. 학기 말 정리 전에 꼭 받아 두세요.</p>
        <div class="row">
          <button class="btn" data-exp="subs">제출물·성찰 노트</button>
          <button class="btn" data-exp="obs">관찰 메모</button>
          <button class="btn" data-exp="setech">세특</button>
        </div>
      </section>
      ${aiSettingsCard()}
    </div>
  </div>`;
  bindAiSettings(v);
  $('#k-check').onclick = e => withBusy(e.currentTarget, '점검하는 중…', async () => {
    try {
      const r = await api.connCheck();
      $('#k-check-out').innerHTML = `<div class="scroll-x"><table><thead><tr><th>항목</th><th>결과</th><th>응답 시간</th></tr></thead><tbody>${r.map(x => `<tr><td>${esc(x.name)}</td><td>${x.ok ? '<span class="pill ok">성공</span>' : '<span class="pill bad">실패</span>'} <span class="small muted">${esc(x.detail)}</span></td><td class="num">${x.ms}ms</td></tr>`).join('')}</tbody></table></div>`;
    } catch (err) { report(err); }
  });
  $('#k-pw-form').onsubmit = async ev => {
    ev.preventDefault();
    const o = $('#k-pw-old').value, n = $('#k-pw-new').value, n2 = $('#k-pw-new2').value;
    if (n.length < 8) { toast('새 비밀번호는 8자 이상으로 정해 주세요.', 'bad'); return; }
    if (n !== n2) { toast('새 비밀번호 두 칸이 서로 달라요.', 'bad'); return; }
    await withBusy($('#k-pw-save'), '바꾸는 중…', async () => {
      try { await api.changePassword(o, n); $$('#k-pw-form input[type=password]').forEach(x => { x.value = ''; }); toast('교사 비밀번호를 바꿨어요.'); }
      catch (err) { report(err); }
    });
  };
  $('#k-term-save').onclick = async e => {
    const t = $('#k-term').value.trim();
    if (!t || t === api.TERM) return;
    if (!(await confirmBox(`학기를 ${t}(으)로 바꿀까요? 학생에게는 새 학기 단원만 보여요.`, '바꾸기'))) return;
    try { await api.setTerm(t); await teaLoadBase(); toast(`${t} 학기로 바꿨어요.`); teaRender(); } catch (err) { report(err); }
  };
  try {
    const u = await api.usage();
    const LIMIT = 1024 * 1024 * 1024, pct = Math.min(100, u.bytes / LIMIT * 100);
    if (!$('#k-usage')) return; // 그사이 다른 탭으로 이동함
    $('#k-usage').innerHTML = `
      <p><b class="num">${fmtBytes(u.bytes)}</b> <span class="muted">/ 1GB (무료 한도) · ${u.term} 학기 사진 ${u.count}장</span></p>
      <div style="height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden" role="img" aria-label="사용량 ${pct.toFixed(1)}%"><div style="height:100%;width:${pct}%;background:${pct > 80 ? 'var(--bad)' : pct > 60 ? 'var(--warn)' : 'var(--accent)'}"></div></div>
      <p class="hint">원본 사진 기준이에요(썸네일은 장당 약 25KB 더). 80%를 넘으면 지난 학기 자료를 백업한 뒤 Supabase Storage에서 지난 학기 폴더를 지워 주세요.</p>`;
  } catch (err) { if ($('#k-usage')) $('#k-usage').innerHTML = '<p class="hint">사용량을 불러오지 못했어요.</p>'; console.error(LOG, err); }
  $$('[data-exp]', v).forEach(b => b.onclick = () => withBusy(b, '만드는 중…', async () => {
    try {
      const d = await api.exportRows();
      const stu = id => d.students.find(s => s.id === id) || {};
      const asg = id => d.assignments.find(a => a.id === id) || {};
      const by = (x, y) => String(stu(x.studentId).studentNo).localeCompare(String(stu(y.studentId).studentNo));
      let rows, name;
      if (b.dataset.exp === 'subs') {
        name = `submissions_${d.term}.csv`;
        rows = [['학번', '이름', '반', '단원', '처음 제출', '마지막 수정', '수정 횟수', '성찰 노트', '자기평가']].concat(
          d.submissions.slice().sort(by).map(x => {
            const s = stu(x.studentId), a = asg(x.assignmentId);
            const refl = (a.guideQuestions || []).map(q => `${q.text}: ${(x.reflection || {})[q.id] || ''}`).join(' / ');
            const se = Object.entries(x.selfEval || {}).map(([c, e]) => `${c}=${LEVEL_TEXT[e.level] || ''}(${e.reason || ''})`).join(' / ');
            return [s.studentNo, s.name, s.classNo, `${a.sortOrder}. ${a.title}`, fmtISO(x.submittedAt), fmtISO(x.updatedAt), Math.max(0, x.revision - 1), refl, se];
          }));
      } else if (b.dataset.exp === 'obs') {
        name = `observations_${d.term}.csv`;
        rows = [['학번', '이름', '날짜', '단원', '메모']].concat(
          d.observations.filter(o => stu(o.studentId).id).sort((x, y) => by(x, y) || String(x.observedOn).localeCompare(String(y.observedOn)))
            .map(o => [stu(o.studentId).studentNo, stu(o.studentId).name, o.observedOn, asg(o.assignmentId).title || '', o.note]));
      } else {
        name = `setech_${d.term}.csv`;
        rows = [['학번', '이름', '학기', '상태', '세특', 'NEIS 바이트']].concat(
          d.drafts.slice().sort(by).map(x => { const t = x.finalText || x.aiDraft || ''; return [stu(x.studentId).studentNo, stu(x.studentId).name, x.term, x.status === 'confirmed' ? '확정' : '초안', t, neisBytes(t)]; }));
      }
      download(name, csvText(rows));
      toast(`${name} (${rows.length - 1}줄)을 내려받았어요.`);
    } catch (err) { report(err); }
  }));
}

/* =====================================================================
 * 시작: 주소의 #teacher 여부로 학생/교사 화면을 고른다
 * ===================================================================== */
async function route() {
  $('#modal').hidden = true;
  if (api.ready) {
    try { await api.ready; }
    catch (e) {
      console.error(LOG, e);
      app.innerHTML = `<section class="card stack"><h2>서버에 연결하지 못했어요</h2><p>${esc(e.message)}</p>
        <p class="hint">index.html 맨 위 APP_CONFIG의 주소·키가 맞는지, Supabase에서 schema.sql을 실행했는지, 학교 방화벽이 supabase.co를 막지 않는지 확인해 주세요.</p></section>`;
      return;
    }
  }
  if (location.hash === '#teacher') {
    if (await api.isTeacher()) teaStart(); else teaLogin();
  } else {
    bootStudent();
  }
}
window.addEventListener('hashchange', route);
if (!window.api) {
  app.innerHTML = '<p class="card">데이터 코드를 불러오지 못했어요. 콘솔(F12)의 빨간 오류를 확인해 주세요.</p>';
  console.error(LOG, 'window.api 가 없습니다.');
} else {
  route();
}
})();
</script>
